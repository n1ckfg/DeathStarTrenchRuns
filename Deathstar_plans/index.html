const W = 128, H = 64;
const u8g2 = (() => {
  const buf = new Uint8Array(W * H);     // draw buffer
  const shown = new Uint8Array(W * H);   // what the panel currently displays
  let cx0 = 0, cy0 = 0, cx1 = W, cy1 = H; // clip window, x1/y1 exclusive
  let color = 1;
  const self = {
    buf, shown, dirty: true,
    setMaxClipWindow() { cx0 = 0; cy0 = 0; cx1 = W; cy1 = H; },
    setClipWindow(x0, y0, x1, y1) { cx0 = Math.max(0, x0); cy0 = Math.max(0, y0); cx1 = Math.min(W, x1); cy1 = Math.min(H, y1); },
    setDrawColor(c) { color = c; },
    clearBuffer() { buf.fill(0); },
    sendBuffer() { shown.set(buf); self.dirty = true; },
    drawPixel(x, y, c = color) {
      x = Math.trunc(x); y = Math.trunc(y);
      if (x >= cx0 && x < cx1 && y >= cy0 && y < cy1) buf[y * W + x] = c;
    },
    // port of u8g2_DrawLine (Bresenham)
    drawLine(x1, y1, x2, y2) {
      x1 = Math.trunc(x1); y1 = Math.trunc(y1); x2 = Math.trunc(x2); y2 = Math.trunc(y2);
      let dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1), swapxy = false, t;
      if (dy > dx) { swapxy = true; t = dx; dx = dy; dy = t; t = x1; x1 = y1; y1 = t; t = x2; x2 = y2; y2 = t; }
      if (x1 > x2) { t = x1; x1 = x2; x2 = t; t = y1; y1 = y2; y2 = t; }
      let err = dx >> 1;

      let y = y1;
      for (let x = x1; x <= x2; x++) {
        if (swapxy) self.drawPixel(y, x); else self.drawPixel(x, y);
        err -= dy;
        if (err < 0) { y += ystep; err += dx; }

    drawBox(x, y, w, h) {
      x = Math.trunc(x); y = Math.trunc(y); w = Math.trunc(w); h = Math.trunc(h);

// ---------------------------------------------------------------- the sketch
const f32 = Math.fround; // the sketch uses float; mirror its rounding
const DEG = 0.0174532;   // "one degree"

// One pass over the vertices, as in each phase of loop().
//  mode 'A': rotateY with (z cos - x sin, z sin + x cos)   — zoom in, turn around
//  mode 'B': rotateY with (z sin - x cos, z cos + x sin)   — up, down, zoom in more
function transform(xAngle, yAngle, zAngle, mode, clampToBox) {
  const rot = f32(xAngle * DEG), yrot = f32(yAngle * DEG), zrot = f32(zAngle * DEG);
  for (let i = 0; i < death_sphere_vertices_cnt; i++) {
    const [vx, vy, vz] = death_sphere_vertices[i];
    let rotz, rotx;
    if (mode === 'A') {
      rotz = f32(vz * Math.cos(yrot) - vx * Math.sin(yrot));
      rotx = f32(vz * Math.sin(yrot) + vx * Math.cos(yrot));
    } else {
      rotz = f32(vz * Math.sin(yrot) - vx * Math.cos(yrot));
      rotx = f32(vz * Math.cos(yrot) + vx * Math.sin(yrot));
    }
    const roty = vy;
    // rotateX
    const rotyy = f32(roty * Math.cos(rot) - rotz * Math.sin(rot));
    const rotzz = f32(roty * Math.sin(rot) + rotz * Math.cos(rot));
    const rotxx = rotx;
    // rotateZ
    let rotxxx = f32(rotxx * Math.cos(zrot) - rotyy * Math.sin(zrot));
    let rotyyy = f32(rotxx * Math.sin(zrot) + rotyy * Math.cos(zrot));
    const rotzzz = rotzz;
    // orthographic projection
    rotxxx = f32(rotxxx * scalefactor + originx);
    rotyyy = f32(rotyyy * scalefactor + originy);
    if (clampToBox) { // keep the vertices in the box
      if (rotxxx < 28) rotxxx = 28; if (rotxxx > 100) rotxxx = 100;
      if (rotyyy < 0) rotyyy = 0;   if (rotyyy > 64) rotyyy = 64;
    }
    wireframe[i][0] = Math.trunc(rotxxx);
    wireframe[i][1] = Math.trunc(rotyyy);
    if (rotzzz > 0) u8g2.drawPixel(rotxxx, rotyyy); // draw_vertices()
  }
}

    draw_wireframe();
    draw_wireframe2();

  }

  // zoom in on the grid (first frame is still the white box: the lines vanish into it)
  for (let j = 1; j < 32; j += 2) {
    for (let i = j; i < 32; i += 2 * j) {
      u8g2.drawFrame(28, 0, 72, 64);
      u8g2.drawLine(64, 0, 64, 32);
      u8g2.drawLine(28, 31 + i, 99, 31 + i);
      u8g2.drawLine(28, 33 - i, 99, 33 - i);
      u8g2.drawLine(63 + i, 0, 63 + i, 64);
      u8g2.drawLine(65 - i, 0, 65 - i, 64);

async function run() {
  const gen = generation;
  try {
    while (gen === generation) await loop();
  } catch (e) {
    if (!(e instanceof Abort)) throw e;
  }

  col += uColor * uGrid * 0.035 * shape * inside * (1.0 - on);
  // white-hot core where pixels are dense
  col += vec3(1.0) * smoothstep(1.2, 4.0, glow) * 0.18 * shape * on;
  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const texData = new Uint8Array(W * H);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, W, H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, texData);

const uRect = gl.getUniformLocation(prog, 'uRect');
const uColor = gl.getUniformLocation(prog, 'uColor');
const uGrid = gl.getUniformLocation(prog, 'uGrid');
gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);

const COLORS = [
  [0.72, 0.88, 1.00], // cool white
  [0.30, 0.62, 1.00], // blue OLED
  [1.00, 0.72, 0.28], // amber
  [0.42, 1.00, 0.62], // green
];
let colorIdx = 0, showGrid = true;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  // largest 2:1 panel that fits, with a small margin; whole-pixel cells when big enough
  let cell = Math.min(w * 0.96 / W, h * 0.92 / H);
  if (cell >= 4) cell = Math.floor(cell);
  const pw = cell * W, ph = cell * H;
  gl.uniform4f(uRect, Math.round((w - pw) / 2), Math.round((h - ph) / 2), pw, ph);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100);
  last = now;
  vclock += dt;
  pump();
  if (u8g2.dirty) {
    for (let i = 0; i < W * H; i++) texData[i] = u8g2.shown[i] ? 255 : 0;
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.LUMINANCE, gl.UNSIGNED_BYTE, texData);
    u8g2.dirty = false;
  }
  gl.uniform3fv(uColor, COLORS[colorIdx]);
  gl.uniform1f(uGrid, showGrid ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- controls
const hint = document.getElementById('hint');
let hintTimer;
function showHint() {
  hint.classList.add('show'); canvas.style.cursor = 'default';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.classList.remove('show'); canvas.style.cursor = 'none'; }, 2500);
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
function restart() {
  generation++;
  pump();
  seqTime = vclock;
  u8g2.setMaxClipWindow(); u8g2.setDrawColor(1); u8g2.clearBuffer(); u8g2.sendBuffer();
  run();
}
addEventListener('mousemove', showHint);
addEventListener('touchstart', showHint, { passive: true });
canvas.addEventListener('dblclick', toggleFullscreen);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFullscreen();
  else if (k === 'c') colorIdx = (colorIdx + 1) % COLORS.length;
  else if (k === 'g') showGrid = !showGrid;
  else if (k === 'r') restart();
  else return;
  showHint();
});
showHint();
run();
</script>
</body>
</html>
